<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Parlé — Очный перевод</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121215">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #121215; color: #f3f3f5; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f1f24; }
    .subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #8e8e93; font-weight: 600; margin-bottom: 2px; }
    .title { font-size: 22px; font-weight: 500; letter-spacing: -0.5px; }
    .lang-badge { font-size: 12px; color: #8e8e93; font-weight: 500; margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .timer { font-size: 14px; font-weight: 500; color: #8e8e93; font-mono: monospace; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; background: #26262e; border: none; color: #f3f3f5; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .icon-btn.active { background: #e55858; color: white; }
    
    .chat-container { flex: 1; padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message-card { background: #1c1c22; border-radius: 16px; padding: 14px 16px; border: 1px solid #282830; }
    .msg-header { font-size: 11px; text-transform: uppercase; color: #8e8e93; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .msg-original { font-size: 15px; color: #e1e1e6; margin-bottom: 6px; line-height: 1.4; }
    .msg-translated { font-size: 16px; font-weight: 500; color: #38d399; line-height: 1.4; }

    footer { background: #18181d; border-top: 1px solid #24242c; padding: 12px 16px 24px; border-top-left-radius: 24px; border-top-right-radius: 24px; }
    .mode-tabs { display: flex; justify-content: space-around; margin-bottom: 12px; border-bottom: 1px solid #262630; padding-bottom: 10px; }
    .tab-btn { background: none; border: none; color: #8e8e93; font-size: 13px; font-weight: 500; cursor: pointer; padding: 6px 12px; border-radius: 8px; }
    .tab-btn.active { color: #f3f3f5; background: #262630; }

    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .text-input { flex: 1; background: #22222a; border: 1px solid #32323e; border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
    .send-btn { background: #32323e; color: #fff; border: none; border-radius: 12px; padding: 0 16px; font-size: 13px; font-weight: 500; cursor: pointer; }

    .main-speak-btn { width: 100%; height: 56px; border-radius: 28px; background: #e6dfd5; color: #121215; border: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
    .main-speak-btn:active, .main-speak-btn.recording { background: #e55858; color: #ffffff; transform: scale(0.98); }
    .hint-text { text-align: center; font-size: 12px; color: #8e8e93; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="subtitle">Разговор очно</div>
      <div class="title">Очный перевод</div>
      <div class="lang-badge" id="langDirection">RU ➔ FR</div>
    </div>
    <div class="header-actions">
      <div class="timer" id="timer">0:00</div>
      <button class="icon-btn" id="muteBtn" onclick="toggleMute()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>
  </header>

  <div class="chat-container" id="chat"></div>

  <footer>
    <div class="mode-tabs">
      <button class="tab-btn active" id="btnMyTurn" onclick="setMode('me')">Я говорю (RU)</button>
      <button class="tab-btn" id="btnTheirTurn" onclick="setMode('them')">Слушать их (FR)</button>
    </div>

    <div class="input-row">
      <input type="text" class="text-input" id="textInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendText()">
      <button class="send-btn" onclick="sendText()">Сказать</button>
    </div>

    <button class="main-speak-btn" id="speakBtn">Удерживайте и говорите</button>
    <div class="hint-text" id="hint">Вы — RU. Им уйдёт FR в динамик.</div>
  </footer>

  <script>
    let mode = 'me'; // 'me' (RU->FR) or 'them' (FR->RU)
    let isMuted = false;
    let seconds = 0;
    let timerInterval = null;
    let recognition = null;
    let isRecording = false;

    // Таймер сессии
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60);
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);

    // Настройка Web Speech API (STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        if (transcript.trim()) {
          await processTranslation(transcript);
        }
      };

      recognition.onerror = (err) => {
        console.error('STT Error:', err);
        stopRecording();
      };

      recognition.onend = () => { stopRecording(); };
    } else {
      alert('Ваш браузер не поддерживает голосовой ввод. Используйте текстовое поле.');
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnMyTurn').classList.toggle('active', mode === 'me');
      document.getElementById('btnTheirTurn').classList.toggle('active', mode === 'them');
      
      if (mode === 'me') {
        document.getElementById('langDirection').innerText = 'RU ➔ FR';
        document.getElementById('hint').innerText = 'Вы — RU. Им уйдёт FR в динамик.';
      } else {
        document.getElementById('langDirection').innerText = 'FR ➔ RU';
        document.getElementById('hint').innerText = 'Собеседник — FR. Вам уйдёт RU в динамик.';
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteBtn').classList.toggle('active', isMuted);
    }

    // Запись голоса по кнопке
    const btn = document.getElementById('speakBtn');
    
    const startRecording = () => {
      if (!recognition || isRecording) return;
      isRecording = true;
      btn.classList.add('recording');
      btn.innerText = 'Слушаю...';
      recognition.lang = mode === 'me' ? 'ru-RU' : 'fr-FR';
      recognition.start();
    };

    const stopRecording = () => {
      if (!isRecording) return;
      isRecording = false;
      btn.classList.remove('recording');
      btn.innerText = 'Удерживайте и говорите';
      if (recognition) recognition.stop();
    };

    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
    btn.addEventListener('mousedown', startRecording);
    btn.addEventListener('mouseup', stopRecording);

    // Google Translate API (Бесплатный шлюз)
    async function translate(text, sl, tl) {
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (e) {
        return 'Ошибка перевода';
      }
    }

    // Озвучка ответа (TTS)
    function speak(text, lang) {
      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    async function processTranslation(text) {
      const sl = mode === 'me' ? 'ru' : 'fr';
      const tl = mode === 'me' ? 'fr' : 'ru';
      const translated = await translate(text, sl, tl);

      addMessageCard(mode === 'me' ? 'ВЫ · RU' : 'СОБЕСЕДНИК · FR', text, translated);
      speak(translated, tl === 'fr' ? 'fr-FR' : 'ru-RU');
    }

    async function sendText() {
      const input = document.getElementById('textInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      await processTranslation(val);
    }

    function addMessageCard(author, original, translated) {
      const chat = document.getElementById('chat');
      const card = document.createElement('div');
      card.className = 'message-card';
      card.innerHTML = `
        <div class="msg-header"><span>${author}</span></div>
        <div class="msg-original">${original}</div>
        <div class="msg-translated">${translated}</div>
      `;
      chat.appendChild(card);
      chat.scrollTop = chat.scrollHeight;
    }

    // Регистрация PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
