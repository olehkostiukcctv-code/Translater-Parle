<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parlé — AI Переводчик</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121215">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121215; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    .btn-beige { background-color: #e3d5ca; color: #121215; }
    .btn-beige:active { background-color: #d5c3b4; }
    .pulse-ring { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(227, 213, 202, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(227, 213, 202, 0); } 100% { box-shadow: 0 0 0 0 rgba(227, 213, 202, 0); } }
  </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Шапка со статусом сети -->
  <header class="flex justify-between items-center py-2 border-b border-zinc-800">
    <div class="flex items-center gap-2">
      <span class="text-xl font-bold tracking-wide">Parlé</span>
      <span id="net-badge" class="text-xs px-2 py-0.5 rounded bg-green-900/60 text-green-300 border border-green-700">Онлайн</span>
    </div>
    <button id="settings-btn" class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400 border border-zinc-700">API Ключ</button>
  </header>

  <!-- Экран 1: Главный выбор режимов -->
  <main id="screen-main" class="flex-1 flex flex-col justify-center gap-4 py-4">
    <div class="text-center mb-2">
      <h1 class="text-2xl font-bold mb-1">Говорите по-русски.<br>Они слышат французский.</h1>
      <p class="text-xs text-zinc-400">РУССКИЙ · FRANÇAIS</p>
    </div>

    <!-- Карточка: Звонок (Онлайн AI) -->
    <button id="btn-mode-call" class="w-full btn-beige p-5 rounded-2xl flex flex-col justify-between text-left h-36 shadow-lg relative overflow-hidden">
      <div>
        <div class="flex justify-between items-start">
          <span class="font-bold text-lg">Звонок</span>
          <span class="text-xs bg-zinc-900/10 px-2 py-0.5 rounded font-mono">AI AUTO</span>
        </div>
        <p class="text-xs text-zinc-700 mt-1">Авто-определение языка на лету через AI-сервер.</p>
      </div>
      <span class="text-xs font-semibold text-zinc-800">Требуется интернет 🌐</span>
    </button>

    <!-- Карточка: Очно (Офлайн) -->
    <button id="btn-mode-face" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl flex flex-col justify-between text-left h-36 shadow-lg">
      <div>
        <div class="flex justify-between items-start">
          <span class="font-bold text-lg text-white">Очно</span>
          <span class="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded font-mono">OFFLINE</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">Ручное переключение каналов [Я] / [France].</p>
      </div>
      <span class="text-xs font-semibold text-green-400">Работает без интернета ⚡</span>
    </button>
  </main>

  <!-- Экран 2: Активный перевод -->
  <main id="screen-active" class="hidden flex-1 flex flex-col justify-between py-2">
    <div class="flex justify-between items-center mb-2">
      <span id="current-mode-label" class="text-xs font-mono uppercase text-zinc-400">Режим</span>
      <button id="btn-back" class="text-xs bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full">← Главная</button>
    </div>

    <!-- Окно вывода текущей речи -->
    <div id="transcript-box" class="flex-1 bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 my-2 overflow-y-auto flex flex-col gap-3">
      <div class="text-xs text-zinc-500 text-center italic">Нажмите кнопку снизу для начала...</div>
    </div>

    <!-- Управление: Звонок -->
    <div id="controls-call" class="hidden flex flex-col gap-2">
      <button id="btn-intro" class="w-full bg-zinc-800 text-zinc-300 py-2.5 rounded-xl text-xs font-medium border border-zinc-700">
        📢 Представиться (Французу в динамик)
      </button>
      <button id="btn-talk-ai" class="w-full btn-beige py-4 rounded-xl font-bold text-base shadow-lg transition-all">
        🎙️ Говорите (AI Авто-режим)
      </button>
    </div>

    <!-- Управление: Очно -->
    <div id="controls-face" class="hidden grid grid-cols-2 gap-3">
      <button id="btn-talk-ru" class="bg-zinc-800 border border-zinc-700 text-white py-4 rounded-xl font-bold text-sm active:bg-zinc-700">
        🇷🇺 Я (RU)
      </button>
      <button id="btn-talk-fr" class="bg-zinc-800 border border-zinc-700 text-white py-4 rounded-xl font-bold text-sm active:bg-zinc-700">
        🇫🇷 France (FR)
      </button>
    </div>
  </main>

  <!-- Экран 3: Двухраздельный Журнал -->
  <main id="screen-history" class="hidden flex-1 flex flex-col justify-between py-2">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-lg font-bold">Журнал переводов</h2>
      <button id="btn-clear-history" class="text-xs bg-red-950/80 text-red-300 border border-red-800 px-3 py-1 rounded-lg">
        🗑️ Очистить
      </button>
    </div>

    <!-- Подменю Журнала: Вкладки Звонок / Очно -->
    <div class="grid grid-cols-2 gap-2 mb-3">
      <button id="tab-hist-call" class="py-2 text-xs font-bold rounded-xl bg-zinc-100 text-zinc-900 transition-all">
        📞 Звонок
      </button>
      <button id="tab-hist-face" class="py-2 text-xs font-bold rounded-xl bg-zinc-800 text-zinc-400 transition-all">
        👥 Очно
      </button>
    </div>

    <!-- Список записей выбранного журнала -->
    <div id="history-box" class="flex-1 bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 overflow-y-auto flex flex-col gap-3">
      <!-- Записи рендерятся из JS -->
    </div>
  </main>

  <!-- Нижняя панель навигации PWA -->
  <nav class="flex justify-around items-center pt-3 border-t border-zinc-800 text-xs text-zinc-500">
    <button id="nav-home" class="flex flex-col items-center text-zinc-100 font-bold">
      <span>💬</span>Перевод
    </button>
    <button id="nav-history" class="flex flex-col items-center hover:text-zinc-300">
      <span>📜</span>Журнал
    </button>
  </nav>

  <!-- Модальное окно настроек API -->
  <div id="modal-settings" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 w-full max-w-xs flex flex-col gap-3">
      <h3 class="font-bold text-sm">Настройки AI (OpenAI / Whisper)</h3>
      <p class="text-xs text-zinc-400">Введите API-ключ для режима «Звонок»:</p>
      <input id="api-key-input" type="password" placeholder="sk-..." class="bg-zinc-800 border border-zinc-700 rounded p-2 text-xs text-white focus:outline-none">
      <div class="flex gap-2 mt-2">
        <button id="btn-save-key" class="flex-1 btn-beige py-1.5 rounded text-xs font-bold">Сохранить</button>
        <button id="btn-close-modal" class="flex-1 bg-zinc-800 text-zinc-300 py-1.5 rounded text-xs">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }

    let state = {
      mode: null,
      recording: false,
      apiKey: localStorage.getItem('whisper_api_key') || '',
      activeHistoryTab: 'call', // 'call' или 'face'
      recognition: null,
      mediaRecorder: null,
      audioChunks: []
    };

    const el = {
      netBadge: document.getElementById('net-badge'),
      screenMain: document.getElementById('screen-main'),
      screenActive: document.getElementById('screen-active'),
      screenHistory: document.getElementById('screen-history'),
      btnModeCall: document.getElementById('btn-mode-call'),
      btnModeFace: document.getElementById('btn-mode-face'),
      btnBack: document.getElementById('btn-back'),
      controlsCall: document.getElementById('controls-call'),
      controlsFace: document.getElementById('controls-face'),
      currentModeLabel: document.getElementById('current-mode-label'),
      transcriptBox: document.getElementById('transcript-box'),
      historyBox: document.getElementById('history-box'),
      btnTalkAi: document.getElementById('btn-talk-ai'),
      btnIntro: document.getElementById('btn-intro'),
      btnTalkRu: document.getElementById('btn-talk-ru'),
      btnTalkFr: document.getElementById('btn-talk-fr'),
      navHome: document.getElementById('nav-home'),
      navHistory: document.getElementById('nav-history'),
      tabHistCall: document.getElementById('tab-hist-call'),
      tabHistFace: document.getElementById('tab-hist-face'),
      btnClearHistory: document.getElementById('btn-clear-history'),
      modalSettings: document.getElementById('modal-settings'),
      settingsBtn: document.getElementById('settings-btn'),
      apiKeyInput: document.getElementById('api-key-input'),
      btnSaveKey: document.getElementById('btn-save-key'),
      btnCloseModal: document.getElementById('btn-close-modal')
    };

    // Сеть
    function updateNetworkStatus() {
      const isOnline = navigator.onLine;
      el.netBadge.textContent = isOnline ? 'Онлайн' : 'Офлайн';
      el.netBadge.className = isOnline 
        ? 'text-xs px-2 py-0.5 rounded bg-green-900/60 text-green-300 border border-green-700'
        : 'text-xs px-2 py-0.5 rounded bg-red-900/60 text-red-300 border border-red-700';
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    // Навигация по вкладкам
    el.navHome.onclick = showHomeScreen;
    el.navHistory.onclick = showHistoryScreen;

    function showHomeScreen() {
      stopRecording();
      el.screenHistory.classList.add('hidden');
      if (state.mode) {
        el.screenMain.classList.add('hidden');
        el.screenActive.classList.remove('hidden');
      } else {
        el.screenMain.classList.remove('hidden');
        el.screenActive.classList.add('hidden');
      }
      highlightNav(el.navHome);
    }

    function showHistoryScreen() {
      stopRecording();
      el.screenMain.classList.add('hidden');
      el.screenActive.classList.add('hidden');
      el.screenHistory.classList.remove('hidden');
      highlightNav(el.navHistory);
      renderHistory();
    }

    function highlightNav(activeBtn) {
      el.navHome.className = 'flex flex-col items-center text-zinc-500';
      el.navHistory.className = 'flex flex-col items-center text-zinc-500';
      activeBtn.className = 'flex flex-col items-center text-zinc-100 font-bold';
    }

    // Режимы разговора
    el.btnModeCall.onclick = () => {
      if (!navigator.onLine) return alert("Для перевода звонка нужен интернет!");
      startMode('call');
    };
    el.btnModeFace.onclick = () => startMode('face');
    el.btnBack.onclick = () => {
      stopAndReturn();
      showHomeScreen();
    };

    function startMode(mode) {
      state.mode = mode;
      el.screenMain.classList.add('hidden');
      el.screenActive.classList.remove('hidden');
      el.transcriptBox.innerHTML = '';

      if (mode === 'call') {
        el.currentModeLabel.textContent = 'Звонок (AI Auto)';
        el.controlsCall.classList.remove('hidden');
        el.controlsFace.classList.add('hidden');
      } else {
        el.currentModeLabel.textContent = 'Очно (Офлайн)';
        el.controlsCall.classList.add('hidden');
        el.controlsFace.classList.remove('hidden');
        initWebSpeech();
      }
    }

    function stopAndReturn() {
      stopRecording();
      state.mode = null;
    }

    // Журнал: Работа с вкладками и LocalStorage
    el.tabHistCall.onclick = () => switchHistoryTab('call');
    el.tabHistFace.onclick = () => switchHistoryTab('face');

    function switchHistoryTab(tab) {
      state.activeHistoryTab = tab;
      if (tab === 'call') {
        el.tabHistCall.className = 'py-2 text-xs font-bold rounded-xl bg-zinc-100 text-zinc-900 transition-all';
        el.tabHistFace.className = 'py-2 text-xs font-bold rounded-xl bg-zinc-800 text-zinc-400 transition-all';
      } else {
        el.tabHistCall.className = 'py-2 text-xs font-bold rounded-xl bg-zinc-800 text-zinc-400 transition-all';
        el.tabHistFace.className = 'py-2 text-xs font-bold rounded-xl bg-zinc-100 text-zinc-900 transition-all';
      }
      renderHistory();
    }

    function saveToHistory(mode, original, translated) {
      const storageKey = mode === 'call' ? 'history_call' : 'history_face';
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const entry = {
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        original,
        translated
      };
      history.unshift(entry); // Новые сверху
      localStorage.setItem(storageKey, JSON.stringify(history));
    }

    function renderHistory() {
      const storageKey = state.activeHistoryTab === 'call' ? 'history_call' : 'history_face';
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      el.historyBox.innerHTML = '';

      if (history.length === 0) {
        el.historyBox.innerHTML = `<div class="text-xs text-zinc-500 text-center italic py-4">Журнал «${state.activeHistoryTab === 'call' ? 'Звонок' : 'Очно'}» пуст</div>`;
        return;
      }

      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'text-xs p-3 rounded-xl bg-zinc-800/90 border border-zinc-700/60 flex flex-col gap-1';
        div.innerHTML = `
          <div class="flex justify-between text-zinc-400 text-[10px]">
            <span>${state.activeHistoryTab === 'call' ? '📞 Звонок' : '👥 Очно'}</span>
            <span>${item.time}</span>
          </div>
          <div class="text-zinc-200">${item.original}</div>
          <div class="text-amber-200/90 font-medium">${item.translated}</div>
        `;
        el.historyBox.appendChild(div);
      });
    }

    el.btnClearHistory.onclick = () => {
      const modeName = state.activeHistoryTab === 'call' ? 'Звонок' : 'Очно';
      if (confirm(`Очистить весь журнал «${modeName}»?`)) {
        const storageKey = state.activeHistoryTab === 'call' ? 'history_call' : 'history_face';
        localStorage.removeItem(storageKey);
        renderHistory();
      }
    };

    // Web Speech API для «Очно»
    function initWebSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return appendLog('Ошибка', 'Браузер не поддерживает STT.');
      
      state.recognition = new SpeechRecognition();
      state.recognition.interimResults = false;

      state.recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        appendLog('Слышу', text);
        translateOffline(text, state.currentLang);
      };

      state.recognition.onerror = () => resetFaceButtons();
      state.recognition.onend = () => resetFaceButtons();
    }

    function listenFace(lang) {
      if (!state.recognition) return;
      state.currentLang = lang;
      state.recognition.lang = lang;
      try {
        state.recognition.start();
        if (lang === 'ru-RU') el.btnTalkRu.classList.add('bg-green-700');
        else el.btnTalkFr.classList.add('bg-green-700');
      } catch (e) {
        state.recognition.stop();
      }
    }

    function resetFaceButtons() {
      el.btnTalkRu.className = 'bg-zinc-800 border border-zinc-700 text-white py-4 rounded-xl font-bold text-sm active:bg-zinc-700';
      el.btnTalkFr.className = 'bg-zinc-800 border border-zinc-700 text-white py-4 rounded-xl font-bold text-sm active:bg-zinc-700';
    }

    el.btnTalkRu.onclick = () => listenFace('ru-RU');
    el.btnTalkFr.onclick = () => listenFace('fr-FR');

    function translateOffline(text, fromLang) {
      const targetLang = fromLang === 'ru-RU' ? 'fr' : 'ru';
      fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang.slice(0,2)}|${targetLang}`)
        .then(r => r.json())
        .then(data => {
          const translated = data.responseData.translatedText;
          appendLog('Перевод', translated);
          saveToHistory('face', text, translated);
          speak(translated, targetLang === 'fr' ? 'fr-FR' : 'ru-RU');
        })
        .catch(() => appendLog('Ошибка', 'Сбой перевода.'));
    }

    function speak(text, lang) {
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        window.speechSynthesis.speak(utter);
      }
    }

    // AI Whisper Запись для «Звонок»
    el.btnTalkAi.onclick = () => {
      if (!state.recording) startAiRecord();
      else stopAiRecord();
    };

    async function startAiRecord() {
      if (!state.apiKey) {
        el.modalSettings.classList.remove('hidden');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.mediaRecorder = new MediaRecorder(stream);
        state.audioChunks = [];

        state.mediaRecorder.ondataavailable = e => state.audioChunks.push(e.data);
        state.mediaRecorder.onstop = sendAudioToAi;

        state.mediaRecorder.start();
        state.recording = true;
        el.btnTalkAi.textContent = '⏹️ Остановить и перевести';
        el.btnTalkAi.classList.add('pulse-ring', 'bg-red-400');
      } catch (err) {
        alert('Нет доступа к микрофону');
      }
    }

    function stopAiRecord() {
      if (state.mediaRecorder && state.recording) {
        state.mediaRecorder.stop();
        state.recording = false;
        el.btnTalkAi.textContent = '🎙️ Говорите (AI Авто-режим)';
        el.btnTalkAi.classList.remove('pulse-ring', 'bg-red-400');
      }
    }

    function stopRecording() {
      if (state.recording) stopAiRecord();
      if (state.recognition) state.recognition.stop();
    }

    async function sendAudioToAi() {
      appendLog('Инфо', 'Обработка AI...');
      const blob = new Blob(state.audioChunks, { type: 'audio/mp3' });
      const formData = new FormData();
      formData.append('file', blob, 'audio.mp3');
      formData.append('model', 'whisper-1');

      try {
        const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.apiKey}` },
          body: formData
        });
        const data = await res.json();
        if (data.text) {
          appendLog('Распознано', data.text);
          // Выполняем и сохраняем перевод в журнал «Звонок»
          fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(data.text)}&langpair=autodetect|fr`)
            .then(r => r.json())
            .then(transData => {
              const translated = transData.responseData.translatedText;
              appendLog('Перевод', translated);
              saveToHistory('call', data.text, translated);
              speak(translated, 'fr-FR');
            });
        }
      } catch (e) {
        appendLog('Ошибка', 'Сбой связи с AI.');
      }
    }

    el.btnIntro.onclick = () => {
      const phrase = "Bonjour, je suis russe et j'utilise un traducteur automatique. Parlons doucement, s'il vous plaît.";
      appendLog('Представился', phrase);
      saveToHistory('call', '[Представление]', phrase);
      speak(phrase, 'fr-FR');
    };

    // Настройки
    el.settingsBtn.onclick = () => el.modalSettings.classList.remove('hidden');
    el.btnCloseModal.onclick = () => el.modalSettings.classList.add('hidden');
    el.btnSaveKey.onclick = () => {
      state.apiKey = el.apiKeyInput.value.trim();
      localStorage.setItem('whisper_api_key', state.apiKey);
      el.modalSettings.classList.add('hidden');
    };

    function appendLog(role, text) {
      const div = document.createElement('div');
      div.className = 'text-xs p-2 rounded bg-zinc-800 border border-zinc-700/50';
      div.innerHTML = `<span class="font-bold text-zinc-400">[${role}]:</span> ${text}`;
      el.transcriptBox.appendChild(div);
      el.transcriptBox.scrollTop = el.transcriptBox.scrollHeight;
    }
  </script>
</body>
</html>
